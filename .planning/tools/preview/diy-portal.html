<script>
// Light is the portal's standard look: set it before the first paint. What the host frame asked for is kept aside, so a
// firm or a viewer who chooses "Match this device" still follows it. Once, this also clears a look chosen earlier in this
// preview, so the standard shows; Dark and Match this device can be chosen again on the Account page.
(function () {
  var r = document.documentElement;
  r.setAttribute('data-host-theme', r.getAttribute('data-theme') || '');
  r.setAttribute('data-theme', 'light');
  try {
    if (localStorage.getItem('cv-preview-light') !== '1') { localStorage.removeItem('sdesk1:appearance'); localStorage.setItem('cv-preview-light', '1'); }
  } catch (e) {}
})();
</script>

    Object.keys(localStorage).filter(function (k) { return k.indexOf('sdesk1:') === 0; }).forEach(function (k) { localStorage.removeItem(k); });

    localStorage.setItem('cv-preview-reset', 'fresh-5');
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }
} catch (e) {}
</script>
